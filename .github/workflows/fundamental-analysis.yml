name: Publier deux analyses fondamentales
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: cap-editorial-pair
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python server/editorial_pair.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          FUNDAMENTAL_ANALYSES: ${{ secrets.FUNDAMENTAL_ANALYSES }}
