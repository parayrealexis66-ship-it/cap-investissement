name: Publier deux analyses fondamentales
on:
  workflow_dispatch:
    inputs:
      lot:
        description: Lot à publier
        type: choice
        options: [standard, adyen]
        default: standard
permissions:
  contents: read
concurrency: cap-editorial-pair
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python server/editorial_pair.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          FUNDAMENTAL_ANALYSES: ${{ secrets[inputs.lot == 'adyen' && 'FUNDAMENTAL_ANALYSES_ADYEN' || 'FUNDAMENTAL_ANALYSES'] }}
