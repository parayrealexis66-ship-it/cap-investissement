name: Publier la revue de presse validée
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/press.yml']
permissions:
  contents: read
concurrency: cap-presse
jobs:
  envoyer:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publier la revue validée dans le salon presse'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install reportlab==4.4.9
      - run: python server/press_send.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          REVUE_PRESSE: ${{ secrets.REVUE_PRESSE }}
