name: Tests accès adhérents
on:
  push:
    paths: ['server/billing_discord.py', 'server/test_billing_discord.py', 'server/instant_confirmation.py', '.github/workflows/discord-billing-tests.yml']
permissions:
  contents: read
  statuses: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install 'discord.py>=2.4,<3'
      - run: python -m compileall -q server/billing_discord.py server/instant_confirmation.py && python -m unittest discover -s server -p 'test_billing_discord.py' -v
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$RESULT" -f context="discord/billing-tests" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
