name: Épingler la répartition validée
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-snapshot.yml', 'server/portfolio_send.py']
permissions:
  contents: read
concurrency: cap-portefeuille
jobs:
  publier:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Épingler le graphique validé'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install Pillow
      - run: python server/portfolio_send.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          PORTFOLIO_SNAPSHOT: ${{ secrets.PORTFOLIO_SNAPSHOT }}
