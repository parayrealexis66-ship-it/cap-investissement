name: Vérification des accès Discord
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/discord-access-inventory.yml']
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les rôles et salons sans publier leurs identifiants
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD: ${{ secrets.DISCORD_GUILD_ID }}
        shell: python
        run: |
          import os, re, unicodedata, urllib.request, json
          def read(resource):
              url = 'https://discord.com/api/v10/guilds/' + os.environ['GUILD'] + '/' + resource
              req = urllib.request.Request(url, headers={'Authorization': 'Bot ' + os.environ['BOT_TOKEN'], 'User-Agent': 'CapInvestissement (Discord access audit, 1.0)'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          def norm(name):
              return ''.join(c for c in unicodedata.normalize('NFKD', name).lower() if c.isascii() and c.isalnum())
          roles = read('roles')
          channels = read('channels')
          for label, keys, items in [
              ('Abonnement', {'abonne','abonnes','premium','membrepremium'}, roles),
              ('Reglement accepte', {'membre','membrevalide','membreconfirme'}, roles),
              ('Portefeuille', {'monportefeuille'}, channels),
              ('Succes', {'vossucces'}, channels),
              ('Flops', {'vosflops'}, channels)
          ]:
              print(label, sum(norm(item['name']) in keys for item in items))
