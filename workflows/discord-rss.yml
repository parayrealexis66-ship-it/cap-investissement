name: Discord RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "15,45 * * * *"

permissions:
  contents: read

concurrency:
  group: discord-rss
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen-item cache
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: discord-rss-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discord-rss-

      - name: Publish new feed items
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rss_to_discord.py

      - name: Save seen-item cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: discord-rss-${{ github.run_id }}-${{ github.run_attempt }}
